{% extends "base.html" %}

{% block content %}
<style>
    /* Fond d'écran avec l'image2.png */
    body {
        background: none !important;
        background-image: url("{{ url_for('static', filename='image.png') }}") !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
    }
    /* Superposition sombre pour améliorer la lisibilité */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }
    /* Style de la carte (formulaire) transparente avec effet glassmorphism */
    .card {
        background: rgba(255, 255, 255, 0.15) !important;
        backdrop-filter: blur(12px);
        border-radius: 1rem;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
    }
    .card label, .card h3, .card p, .card a {
        color: white;
    }
    .card a:hover {
        color: #ddd;
    }
    .form-control {
        background: rgba(255, 255, 255, 0.85);
        border: none;
        border-radius: 0.5rem;
    }
    .form-control:focus {
        background: rgba(255, 255, 255, 0.95);
        box-shadow: none;
        border: 1px solid #667eea;
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 0.5rem;
        transition: transform 0.2s;
    }
    .btn-primary:hover {
        transform: scale(1.02);
        background: linear-gradient(135deg, #7b8aec 0%, #8b5cb8 100%);
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4">Connexion</h3>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>
            <p class="text-center mt-3">Pas encore de compte ? <a href="/register">Inscrivez-vous</a></p>
        </div>
    </div>
</div>
{% endblock %}
