{% extends "base.html" %}

{% block content %}
<style>
    /* Supprimer le fond dégradé du body (défini dans base.html) */
    body {
        background: none !important;
        background-image: url("{{ url_for('static', filename='image1.png') }}") !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        position: relative;
    }

    /* Ajouter une superposition sombre pour la lisibilité du texte */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }

    /* Rendre la navbar transparente (optionnel) */
    .navbar {
        background: rgba(0, 0, 0, 0.7) !important;
        backdrop-filter: blur(5px);
    }

    /* Centrer le contenu principal */
    .main-content {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        text-align: center;
        color: white;
        padding: 2rem;
    }

    .btn-light {
        background-color: white;
        color: #333;
        border: none;
        transition: transform 0.2s;
    }
    .btn-light:hover {
        transform: scale(1.05);
        background-color: #f0f0f0;
    }
</style>

<div class="main-content">
    <div>
        <h1 class="display-4 fw-bold">Job Intelligent</h1>
        <p class="lead">Trouver votre job juste en clique grâce à nos recommandations intelligentes.</p>
        <a href="/login" class="btn btn-light btn-lg mt-3">Commencer</a>
    </div>
</div>
{% endblock %}
